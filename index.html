<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test TCAE Doris</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="icon" href="flavicon.ico" type="image/x-icon">
</head>
<body>
    <h1>Test TCAE Doris</h1>
    <label for="themeSelector">Selecciona un tema:</label>
    <select id="themeSelector"></select>
    <br>
    <label for="numQuestions">Número de preguntas (entre 1 y 100):</label>
    <input type="number" id="numQuestions" value="25" min="1" max="100"> <!-- Valor predeterminado de 30 preguntas, mínimo 1, máximo 100 -->
    <br>
    <label for="timeLimit">Tiempo límite (en minutos, entre 5 y 120):</label>
    <input type="number" id="timeLimit" value="30" min="5" max="120"> <!-- Valor predeterminado de 15 minutos, mínimo 5, máximo 90 -->
    <br>
    <button id="startTestBtn" onclick="startTest()">Comenzar Test</button>

    <div id="quiz" class="hidden">
        <!-- Contenido del test -->
    </div>
    
    <div id="results" class="hidden">
        <!-- Contenido de los resultados -->
    </div>
    <button id="getResultsBtn" onclick="getResults()" style="display: none;">Obtener Resultados</button>
    <button id="finishTestBtn" onclick="finishTest()" style="display: none;">Finalizar Test</button>
    <div id="floating-clock"></div>
    
    <script src="script.js"></script>
</body>
</html>
