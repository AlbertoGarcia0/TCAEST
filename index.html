<!DOCTYPE html>
<html>
<head>
    <title>Test TCAE Doris</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>
<body>
    <h1>Test TCAE Doris</h1>
    <label for="themeSelector">Selecciona un tema:</label>
    <select id="themeSelector"></select>
    <br>
    <label for="numQuestions">Número de preguntas (entre 1 y 100):</label>
    <input type="number" id="numQuestions" value="30" min="1" max="100"> <!-- Valor predeterminado de 30 preguntas, mínimo 1, máximo 100 -->
    <br>
    <label for="timeLimit">Tiempo límite (en minutos, entre 5 y 90):</label>
    <input type="number" id="timeLimit" value="15" min="5" max="90"> <!-- Valor predeterminado de 15 minutos, mínimo 5, máximo 90 -->
    <br>
    <button onclick="startTest()">Comenzar Test</button>
    <div id="quiz" class="hidden">
        <!-- Preguntas se cargarán aquí dinámicamente -->
    </div>
    <div id="results" class="hidden">
        <!-- Resultados se mostrarán aquí dinámicamente -->
    </div>
    <button onclick="finishTest()">Finalizar Test</button>

    <script src="script.js"></script>
</body>
</html>
